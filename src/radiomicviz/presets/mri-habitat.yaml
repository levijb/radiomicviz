# radiomicviz preset: mri-habitat
# Curated first-order + texture subset for habitat clustering workflows.
# Designed for intra-tumor heterogeneity analysis. No shape features (not
# meaningful in voxelwise / sliding-window mode).
#
# Uses the same discretization settings as all other presets for cross-preset
# comparability. The voxelSetting block controls the sliding-window kernel.

setting:
  binCount: 32
  geometryTolerance: 1e-4
  label: 1
  interpolator: 'sitkBSpline'
  resampledPixelSpacing: null
  normalize: true
  normalizeScale: 100
  voxelArrayShift: 300
  preCrop: true
  correctMask: true
  additionalInfo: true

imageType:
  Original: {}

featureClass:
  firstorder:
  glcm:
    - 'Autocorrelation'
    - 'Contrast'
    - 'Correlation'
    - 'DifferenceEntropy'
    - 'JointEnergy'
    - 'JointEntropy'
    - 'SumEntropy'
    - 'SumSquares'
  glrlm:

voxelSetting:
  kernelRadius: 1
  maskedKernel: true
  initValue: nan
  voxelBatch: 2500
